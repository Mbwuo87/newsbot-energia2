<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ label }} · Resumen IA</title>
<style>
  body { font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:#f4f6f8; color:#1a1a1a; margin:0; padding:40px 16px; }
  .card { max-width:640px; margin:0 auto; background:#fff; border-radius:12px;
          padding:32px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .tag { display:inline-block; font-size:12px; color:#fff; background:#0b5cad;
         padding:2px 10px; border-radius:10px; margin-bottom:12px; }
  h1 { font-size:24px; margin:0 0 16px; }
  .summary { font-size:16px; line-height:1.7; color:#344054; }
  .disclaimer { margin-top:24px; padding-top:16px; border-top:1px solid #eaecf0;
                font-size:12px; color:#98a2b3; }
  a.back { color:#0b5cad; font-size:13px; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <span class="tag">Resumen generado por IA</span>
    <h1>{{ label }}</h1>
    <div class="summary">{{ summary_html | safe }}</div>
    <div class="disclaimer">
      ⚠️ Este resumen fue generado automáticamente por inteligencia artificial y puede
      contener imprecisiones. Verificá siempre en la fuente oficial
      (Boletín Oficial / Congreso) antes de tomar decisiones.<br><br>
      Actualizado: {{ generated_at }}
    </div>
  </div>
</body>
</html>
