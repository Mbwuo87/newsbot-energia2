name: Reporte diario de energía

on:
  schedule:
    # 11:00 UTC = 08:00 en Argentina (Argentina no tiene horario de verano)
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # permite lanzarlo a mano desde la pestaña "Actions" para probar

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el robot de noticias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: python src/main.py

      - name: Guardar cambios (estado y reporte publicado)
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add data/state.json docs/
          git diff --staged --quiet || git commit -m "Reporte automático $(date -u +'%Y-%m-%d')"
          git push
