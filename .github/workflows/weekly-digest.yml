name: Weekly News Digest

# ============================================================
#  Se ejecuta todos los lunes a las 08:00 ART (11:00 UTC).
#  Argentina no aplica horario de verano => siempre UTC-3.
#  También se puede disparar manualmente desde la pestaña Actions.
# ============================================================
on:
  schedule:
    - cron: "0 11 * * 1"       # min hora dia mes dia-semana (1 = lunes)
  workflow_dispatch:            # botón "Run workflow" para probar cuando quieras
    inputs:
      dry_run:
        description: "Generar preview sin enviar email (true/false)"
        required: false
        default: "false"

permissions:
  contents: write               # para commitear las páginas de leyes / webview

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news bot
        env:
          # --- Secrets (configurar en Settings > Secrets and variables > Actions) ---
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}   # opcional (Azure/OpenRouter)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # --- Variables públicas ---
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

      - name: Commit published pages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/ state/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update digest pages [skip ci]"
            git push
          else
            echo "Sin cambios que commitear."
          fi

      - name: Upload preview (solo dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: preview.html
